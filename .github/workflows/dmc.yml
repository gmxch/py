name: dmc

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      proxy:
        description: 'Proxy'
        required: false
        default: ''
        type: string
      wallet_count:
        description: 'Jumlah wallet baru'
        required: false
        default: '5'
        type: string

concurrency:
  group: dmc-run
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Node Dependencies
        run: npm install ethers axios

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: pip install aiohttp

      - name: Generate Wallets
        env:
          SEED_MNEMONIC_B64: ${{ secrets.SEED_MNEMONIC_B64 }}
        run: node dmc.js ${{ inputs.wallet_count || '5' }}

      - name: Run Script
        env:
          USER_REFERRAL_ID: ${{ secrets.USER_REFERRAL_ID }}
          LOCAL_CLIENT_KEY: ${{ secrets.LOCAL_CLIENT_KEY }}
          PROXY_URL: ${{ inputs.proxy || secrets.PROXY_URL }}
        run: |
          timeout 20000 python dmc.py || true
        continue-on-error: true
